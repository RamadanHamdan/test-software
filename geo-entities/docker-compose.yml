services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skrip init hanya jalan saat volume masih kosong (start pertama).
      # Reset: docker compose down -v && docker compose up -d db
      - ./backend/migrations/000001_create_entities.up.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geo -d geo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
